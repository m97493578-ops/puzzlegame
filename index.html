<!DOCTYPE html><html><head><meta charset="utf-8"><title>M</title><style>
body{font-family:sans-serif;background:#eee;text-align:center;margin:20px}
#g{display:grid;grid-template-columns:repeat(5,50px);gap:3px;justify-content:center;margin:15px auto;background:#333;padding:5px;width:262px;border-radius:6px}
.c{width:50px;height:50px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none;border-radius:4px}
.c[data-z="0"]{background:#ffb7b2}.c[data-z="1"]{background:#ffdac1}.c[data-z="2"]{background:#e2f0cb}.c[data-z="3"]{background:#b5ead7}.c[data-z="4"]{background:#c7ceea}
.h{opacity:.4;font-size:1.1rem}#s{font-weight:bold;height:20px;margin:10px}
</style></head><body>
<h3>Meowdoku Lite</h3><div id="g"></div><div id="s"></div><button onclick="r()">Reset</button>
<script>
const S=5,M=[[0,0,0,1,1],[0,2,2,1,1],[3,2,2,2,1],[3,3,4,4,4],[3,3,3,4,4]];
let b=Array(S).fill(0).map(()=>Array(S).fill('')),h=Array(S).fill(0).map(()=>Array(S).fill(0));
function g(){
 let e=document.getElementById('g');e.innerHTML='';
 for(let r=0;r<S;r++)for(let c=0;c<S;c++){
  let d=document.createElement('div');d.className='c';d.dataset.z=M[r][c];
  d.onclick=()=>{
   if(h[r][c]&&b[r][c]!=='k')return;
   b[r][c]=b[r][c]===''? 'b':(b[r][c]==='b'?'k':'');up();g();v();
  };
  if(b[r][c]==='k')d.innerText='🐱';
  else if(b[r][c]==='b'||h[r][c]){d.innerText='🦴';if(h[r][c]&&b[r][c]!=='k')d.className+=' h'}
  e.appendChild(d);
 }
}
function up(){
 h=Array(S).fill(0).map(()=>Array(S).fill(0));
 for(let r=0;r<S;r++)for(let c=0;c<S;c++)if(b[r][c]==='k')
  for(let i=0;i<S;i++){if(i!==c)h[r][i]=1;if(i!==r)h[i][c]=1}
}
function v(){
 let o=document.getElementById('s'),cats=[],count=0;o.innerText='';o.style.color='red';
 for(let r=0;r<S;r++)for(let c=0;c<S;c++)if(b[r][c]==='k'){count++;cats.push({r,c,z:M[r][c]})}
 for(let i=0;i<cats.length;i++)for(let j=i+1;j<cats.length;j++){
  let c1=cats[i],c2=cats[j];
  if(c1.r===c2.r||c1.c===c2.c||c1.z===c2.z){o.innerText='Conflict!';return}
  if(Math.abs(c1.r-c2.r)<=1&&Math.abs(c1.c-c2.c)<=1){o.innerText='Adjacent!';return}
 }
 if(count===S){o.innerText='Win! 🎉';o.style.color='green'}
}
function r(){b=Array(S).fill(0).map(()=>Array(S).fill(''));h=Array(S).fill(0).map(()=>Array(S).fill(0));document.getElementById('s').innerText='';g()}
g();
</script></body></html>
